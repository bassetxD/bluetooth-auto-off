name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Environment ==="
          java -version
          echo "JAVA_HOME is: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "${JAVA_VERSION_OUTPUT}" | sed -E -n 's/.*version "([0-9]+).*/\1/p' | head -n 1)

          if [ -z "${JAVA_MAJOR}" ]; then
            echo "ERROR: Could not detect the active Java major version." >&2
            exit 1
          fi

          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "ERROR: Active Java major version (${JAVA_MAJOR}) is lower than 17." >&2
            exit 1
          fi
          echo "Java environment verification passed (Java ${JAVA_MAJOR} >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking debug.keystore ==="
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "${KEYSTORE_PATH}" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_PATH}" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            if [ ! -f "${KEYSTORE_PATH}" ]; then
              echo "ERROR: Failed to create ./debug.keystore." >&2
              exit 1
            fi
            echo "Temporary debug keystore generated successfully."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== Verifying Debug APK ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "ERROR: Expected debug APK not found at ${EXPECTED_APK}!" >&2
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi

          if [ ! -r "${EXPECTED_APK}" ] || [ ! -s "${EXPECTED_APK}" ]; then
            echo "ERROR: ${EXPECTED_APK} is not a valid or non-empty file." >&2
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *) echo "ERROR: ${EXPECTED_APK} does not have the .apk extension." >&2; exit 1 ;;
          esac

          if [ "${EXPECTED_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk." >&2
            exit 1
          fi

          echo "APK verified successfully: ${EXPECTED_APK} ($(du -h "${EXPECTED_APK}" | cut -f1))"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_ASSET_DIR="${RUNNER_TEMP}/release_asset_dir"
          mkdir -p "${TEMP_ASSET_DIR}"

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "${RAW_REPO_NAME}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._-')
          if [ -z "${SANITIZED_REPO}" ]; then
            SANITIZED_REPO="android-app"
          fi

          ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TARGET_APK_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"

          cp "${SOURCE_APK}" "${TARGET_APK_PATH}"

          if [ ! -s "${TARGET_APK_PATH}" ]; then
            echo "ERROR: Target release asset was not created or is empty: ${TARGET_APK_PATH}" >&2
            exit 1
          fi

          echo "Asset path: ${TARGET_APK_PATH}"
          echo "Asset filename: ${ASSET_FILENAME}"
          echo "asset_path=${TARGET_APK_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI & Release Asset ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "ERROR: Release asset does not exist or is empty: ${ASSET_PATH}" >&2
            exit 1
          fi

          case "${ASSET_PATH}" in
            *.apk) ;;
            *) echo "ERROR: Release asset is not a .apk file: ${ASSET_PATH}" >&2; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES="### Automated Debug Build

This is an automatically generated debug APK built by GitHub Actions.

- **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
- **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
- **Commit SHA:** ${GITHUB_SHA}
- **Artifact Name:** ${ASSET_NAME}

> **Notice:** This APK is intended for testing and development purposes. It is not a Play Store production release and is signed only with a temporary debug keystore."

          echo "Creating GitHub Release with tag: ${RELEASE_TAG}..."
          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}" \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Reporting Build & Release Outcome ==="
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_filename }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          if [ "${RELEASE_STATUS}" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            gh release view "${RELEASE_TAG}" || true
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"

            echo "### :rocket: Debug APK Published to GitHub Releases" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was successfully built and published." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [${RELEASE_TAG}](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Asset Filename:** \`${ASSET_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Download Location:** You can download the APK directly from the **Assets** section of the release page on your phone or computer." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup Artifact:** The standard GitHub Actions artifact \`app-debug-apk\` is also available on this workflow run page." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            echo "The debug APK build was completed successfully."
            echo "The Actions artifact 'app-debug-apk' remains available for download."

            echo "### :warning: Release Publishing Notice" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**The debug APK was built successfully!**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "However, automatic GitHub Release publishing encountered an issue or was skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Artifact Available:** The verified debug APK is safely preserved as a GitHub Actions artifact named \`app-debug-apk\`." >> "$GITHUB_STEP_SUMMARY"
            echo "- **How to Download:** Go to the summary page of this workflow run and download the \`app-debug-apk\` artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
